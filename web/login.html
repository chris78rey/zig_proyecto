<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Acceso Oracle · Comparar SIS.ITEMS</title>
    <link rel="stylesheet" href="/css/login.css">
  </head>
  <body>
    <main class="login-card">
      <div class="brand-mark">O<span>→</span>P</div>
      <p class="eyebrow">COMPARACIÓN DE DESCRIPCIONES</p>
      <h1>Iniciar sesión</h1>
      <p class="intro">Accede con tu usuario Oracle para comparar descripciones de SIS.ITEMS.</p>
      <form id="login-form">
        <label for="username">Usuario Oracle</label>
        <input id="username" name="username" autocomplete="username" required maxlength="128" autofocus>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="512">
        <button id="submit" type="submit">Conectar con Oracle</button>
        <p id="error" role="alert" hidden></p>
      </form>
      <p class="privacy">La contraseña se usa para validar la conexión y no se guarda en SQLite.</p>
    </main>
    <script>
      const form = document.querySelector("#login-form");
      const button = document.querySelector("#submit");
      const error = document.querySelector("#error");
      form.addEventListener("submit", async event => {
        event.preventDefault();
        error.hidden = true;
        button.disabled = true;
        button.textContent = "Validando credenciales…";
        try {
          const response = await fetch("/api/v1/login", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: form.username.value, password: form.password.value })
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.error || "No se pudo iniciar sesión.");
          form.password.value = "";
          location.replace("/items/compare");
        } catch (failure) {
          error.textContent = failure.message;
          error.hidden = false;
        } finally {
          button.disabled = false;
          button.textContent = "Conectar con Oracle";
        }
      });
    </script>
  </body>
</html>
